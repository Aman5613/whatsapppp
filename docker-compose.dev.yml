# Development docker-compose override:
# Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    build:
      context: ./apps/api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./apps/api:/app
    environment:
      - DEBUG=true

  web:
    build:
      context: ./apps/web
      target: build
    volumes:
      - ./apps/web:/app
      - /app/node_modules
